name: Deploy Portfolio to VPS

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Formatear tag de la imagen
        id: string
        run: |
          echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/portfolio-app:latest" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.string.outputs.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Copiar docker-compose.yml al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/apps/portfolio-app"

      - name: Desplegar con Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/portfolio-app:latest" | tr '[:upper:]' '[:lower:]')
            
            cd ~/apps/portfolio-app
            
            # Descargar imagen y levantar el servicio
            docker compose pull
            docker compose up -d

            # Limpiar imágenes viejas sin usar
            docker image prune -f